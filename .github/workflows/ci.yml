name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check lockfile
        uses: ./tooling/github/lockfile-check

  lint:
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  trigger-build:
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Check Trigger.dev task bundle
        run: pnpm check:trigger-build

      - name: Generate Prisma client
        run: pnpm -F @repo/db db:generate

      # The bundle check above leaves @prisma/client external, so it can't see a
      # missing runtime export. The real build can; run it before merge so a
      # broken Trigger deploy can't land on main.
      - name: Verify Trigger.dev deployment build
        shell: bash
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::warning::TRIGGER_ACCESS_TOKEN isn't available here (fork PR?), so the real Trigger.dev build was skipped."
            exit 0
          fi
          pnpm exec trigger deploy --dry-run --skip-update-check

  format:
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck
