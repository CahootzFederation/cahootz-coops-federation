name: Mobile E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mobile-e2e.yml"
      - "apps/api/**"
      - "apps/mobile/**"
      - "packages/db/**"
      - "packages/trpc/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mobile-e2e.yml"
      - "apps/api/**"
      - "apps/mobile/**"
      - "packages/db/**"
      - "packages/trpc/**"
      - "package.json"
      - "pnpm-lock.yaml"
  # Nightly, ~2-3am US Eastern. Runs main only. GitHub emails a failed scheduled
  # run to whoever last changed this cron line.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Three tiers, so a PR gets an answer in ~10 min instead of 30:
#   pull request  @smoke journeys + every spec file the PR changed, in 2 shards.
#                 A change to the E2E harness itself runs the whole
#                 deterministic suite instead.
#   push to main  the whole deterministic suite, in 4 shards.
#   nightly/manual  the whole deterministic suite plus the live-model @sage
#                 journeys. Those answer differently from run to run, so they
#                 report drift nightly rather than gating PRs.
# On one runner the full suite took 20-30 min: three browsers, Metro, the API
# and Next shared 4 vCPUs, so page reloads of the dev bundle ran past test
# timeouts. Every shard gets its own runner and database. Shards split by file,
# so specs that take turns through e2e/support/exclusive.ts only wait on specs
# in their own shard.
jobs:
  plan:
    name: Choose journeys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The PR merge commit and its first parent (the base), to diff them.
          fetch-depth: 2

      - name: Plan the run
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full_ui() {
            for i in 1 2 3 4; do
              jq -nc --arg i "$i" '{name: "\($i)/4", key: "ui-\($i)", grep: "", grep_invert: "@sage", shard: "\($i)/4"}'
            done
          }

          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
            if echo "$changed" | grep -qE '^(apps/mobile/e2e/support/|apps/mobile/e2e/auth\.setup\.ts$|apps/mobile/playwright\.config\.ts$|\.github/workflows/mobile-e2e\.yml$)'; then
              echo "The E2E harness changed; running every deterministic journey."
              rows=$(full_ui)
            else
              # Playwright matches --grep against the file name too, so this
              # picks the @smoke journeys plus every test in a changed spec.
              grep_re='@smoke'
              for spec in $(echo "$changed" | grep -E '^apps/mobile/e2e/[a-z0-9-]+\.spec\.ts$' || true); do
                name=$(basename "$spec" .spec.ts)
                echo "Changed spec: $name"
                grep_re="$grep_re|(^|[/ ])${name}\\.spec\\.ts"
              done
              rows=$(for i in 1 2; do
                jq -nc --arg i "$i" --arg g "$grep_re" '{name: "PR \($i)/2", key: "pr-\($i)", grep: $g, grep_invert: "@sage", shard: "\($i)/2"}'
              done)
            fi
          else
            rows=$(full_ui)
            if [ "$EVENT" != "push" ]; then
              rows="$rows"$'\n'$(jq -nc '{name: "Sage", key: "sage", grep: "@sage", grep_invert: "", shard: ""}')
            fi
          fi

          matrix=$(echo "$rows" | jq -sc '{include: .}')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mobile-e2e:
    name: Mobile UI journeys (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cahootz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cahootz_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cahootz_e2e
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PORT: "3001"
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3001
      EXPO_PUBLIC_WEB_URL: http://localhost:8081
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      WALLET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET || 'whsec_ci_placeholder' }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      E2E_STRIPE_CONNECTED_ACCOUNT_ID: ${{ secrets.E2E_STRIPE_CONNECTED_ACCOUNT_ID }}
      SLACK_WEBHOOK_URL: https://example.com/ci-placeholder
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: support@mail.cahootzcoops.com
      SENTRY_DSN: https://public@example.com/1
      # Required for journey 15 (sage-trend.spec.ts) and the other @sage journeys, which exercise
      # Sage's real models rather than a mock. Add this as a repo secret in GitHub -
      # Settings > Secrets and variables > Actions - or those journeys will fail in CI.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      E2E_BASE_URL: http://localhost:8081
      E2E_API_BASE_URL: http://localhost:3001
      E2E_USER_A_EMAIL: releaseclick1@test.cahootz.local
      E2E_USER_B_EMAIL: releaseclick2@test.cahootz.local
      E2E_LOGIN_CODE: "000000"
      # Platform admin journey (admin-commons-ai.spec.ts) drives the web admin portal. The web app and
      # API must share SESSION_SECRET (admin API tokens) and both allowlist the test admin.
      E2E_ADMIN_BASE_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: e2e-admin@test.cahootz.local
      PLATFORM_ADMIN_EMAILS: e2e-admin@test.cahootz.local
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_API_URL: http://localhost:3001/trpc
      NEXT_PUBLIC_URI: http://localhost:3001
      NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      SKIP_BLOG_SYNC: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -F @cahootz/mobile exec playwright install --with-deps chromium

      - name: Build API workspace packages
        run: pnpm --filter @repo/trpc... --fail-if-no-match build

      - name: Prepare database
        run: |
          pnpm -F @repo/db exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm -F @repo/db exec tsx scripts/seed-coop-config.ts
          pnpm -F @repo/db exec ts-node --transpile-only scripts/seed-test-users.ts -- --coopId=cahootz --count=2 --prefix=releaseclick
          pnpm -F @repo/db seed:e2e-marketplace

      - name: Start API and mobile web app
        run: |
          nohup pnpm -F @cahootz/api dev > /tmp/cahootz-api.log 2>&1 &
          echo $! > /tmp/cahootz-api.pid
          # Metro holds the whole web bundle in memory for the run; the default
          # heap ran out partway through the full suite.
          NODE_OPTIONS=--max-old-space-size=6144 nohup setsid pnpm -F @cahootz/mobile dev > /tmp/cahootz-mobile.log 2>&1 &
          echo $! > /tmp/cahootz-mobile.pid
          nohup pnpm -F @cahootz/web dev --port 3000 > /tmp/cahootz-web.log 2>&1 &
          echo $! > /tmp/cahootz-web.pid

      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/health/db >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/cahootz-api.log
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8081 >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/cahootz-mobile.log
              exit 1
            fi
            sleep 2
          done

          # Next compiles a route on first request; this also warms the admin login page.
          for attempt in {1..90}; do
            if curl --fail --silent --max-time 120 http://localhost:3000/portal/admin/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat /tmp/cahootz-web.log
              exit 1
            fi
            sleep 2
          done

      # Metro compiles the web bundle on its first request. Do that here so the
      # compile isn't charged against the first test's timeout.
      - name: Warm up the web bundle
        shell: bash
        run: |
          bundle_path=$(curl --fail --silent http://localhost:8081 | grep -o 'src="/[^"]*\.bundle[^"]*"' | head -1 | sed 's/^src="//; s/"$//')
          if [ -z "$bundle_path" ]; then
            echo "No bundle script found in the web app's HTML; skipping warm-up"
            exit 0
          fi
          time curl --fail --silent --output /dev/null --max-time 300 "http://localhost:8081${bundle_path}"

      - name: Run UI tests
        shell: bash
        env:
          GREP: ${{ matrix.grep }}
          GREP_INVERT: ${{ matrix.grep_invert }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=()
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          if [ -n "$GREP_INVERT" ]; then args+=(--grep-invert "$GREP_INVERT"); fi
          if [ -n "$SHARD" ]; then args+=(--shard "$SHARD"); fi
          pnpm -F @cahootz/mobile exec playwright test "${args[@]}"

      - name: Collect server logs
        if: ${{ always() }}
        run: |
          mkdir -p output/playwright/server-logs
          if [ -f /tmp/cahootz-api.log ]; then
            cp /tmp/cahootz-api.log output/playwright/server-logs/api.log
          fi
          if [ -f /tmp/cahootz-mobile.log ]; then
            cp /tmp/cahootz-mobile.log output/playwright/server-logs/mobile.log
          fi
          if [ -f /tmp/cahootz-web.log ]; then
            cp /tmp/cahootz-web.log output/playwright/server-logs/web.log
          fi

      - name: Upload E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-${{ matrix.key }}
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 14

  # The shard jobs' names change with the tier, so branch protection should
  # require this one instead.
  result:
    name: Mobile E2E
    needs: [plan, mobile-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every shard passed
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.mobile-e2e.result }}
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          [ "$PLAN" = "success" ] && [ "$SHARDS" = "success" ]
