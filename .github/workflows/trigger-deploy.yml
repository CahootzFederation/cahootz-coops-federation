name: Deploy Trigger.dev

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3
  TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
  TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Check Trigger.dev task bundle
        run: pnpm check:trigger-build

      - name: Check Trigger.dev environment
        shell: bash
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: TRIGGER_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$TRIGGER_PROJECT_REF" ]; then
            echo "Missing GitHub Actions repository variable: TRIGGER_PROJECT_REF"
            exit 1
          fi

      - name: Generate Prisma client
        run: pnpm -F @repo/db db:generate

      - name: Verify Trigger.dev deployment build
        run: pnpm exec trigger deploy --dry-run --skip-update-check

      - name: Deploy Trigger.dev tasks
        run: pnpm deploy:trigger

      - name: Tell Slack the deploy failed
        if: failure()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret isn't set, so no Slack alert was sent."
            exit 0
          fi
          title="$(printf '%s' "${COMMIT_TITLE:-manual run}" | head -n1)"
          text=":rotating_light: Trigger.dev deploy failed, so production is still running the last good version. New task code isn't live until this is fixed.
          Commit: ${title} (${GITHUB_SHA::7})
          Logs: ${RUN_URL}"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
