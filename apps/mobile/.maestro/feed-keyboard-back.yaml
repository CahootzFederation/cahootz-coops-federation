# A signed-in member opens the General feed, types in the composer and can
# still see the Post button above the keyboard (edge-to-edge keyboard
# insets), then uses the hardware back button to close the keyboard and
# return to Circle View. Nothing is posted, so there is nothing to clean up.
# Pass EMAIL and LOGIN_CODE with -e (see TESTING.md).
appId: com.cahootzcoops.mobile
name: Feed composer, keyboard and back button
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      LOGIN_CODE: ${LOGIN_CODE}
- tapOn: "General"
- tapOn: "Share what's happening..."
- inputText: "E2E android draft"
- assertVisible: "Post"
- pressKey: Back
- assertVisible: "E2E android draft"
- pressKey: Back
- assertVisible: "General"
- assertVisible: "Open menu"
