# A signed-in member opens the General feed, types in the composer and can
# still see the Post button above the keyboard (keyboard insets on both
# platforms, edge-to-edge on Android). On Android the hardware back button
# closes the keyboard, the draft survives, and the Commons tab returns to
# Circle View; on iOS the draft is checked with the keyboard up and a relaunch
# returns to Circle View. (Opening a circle
# replaces Circle View rather than pushing on top of it, so there is no
# screen behind the feed to go back to.) Nothing is posted.
# Pass EMAIL and LOGIN_CODE with -e (see TESTING.md).
appId: com.cahootzcoops.mobile
name: Feed composer and keyboard
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      LOGIN_CODE: ${LOGIN_CODE}
- tapOn: "General"
- tapOn: "Share what's happening..."
- inputText: "E2E native draft"
- assertVisible: "Post"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - assertVisible: "E2E native draft"
      - tapOn: "Commons"
# iOS has no back button, and Maestro can't hide its keyboard here, so the
# draft and Post button are checked with the keyboard up; relaunching the
# app (still signed in) then lands back on Circle View.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "E2E native draft"
      - launchApp
- assertVisible: "General"
- assertVisible: "Open menu"
